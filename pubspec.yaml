name: mj_ai
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: any
  flutter_tts: any
  http: any
  flutter_background_service: any # बैकग्राउंड के लिए
